version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/froggybot
    schedule:
      interval: weekly
    groups:
      application-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/froggybot/amplify
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /agentcore/cdk
    schedule:
      interval: weekly
    groups:
      agentcore-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
