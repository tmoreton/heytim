version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/New_York
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /apps/website
      - /services/API
      - /agentcore/cdk
    schedule:
      interval: weekly
      day: monday
      timezone: America/New_York
    groups:
      npm-production:
        dependency-type: production
        patterns: ['*']
      npm-development:
        dependency-type: development
        patterns: ['*']

  - package-ecosystem: uv
    directory: /services/runtime
    schedule:
      interval: weekly
      day: monday
      timezone: America/New_York
    groups:
      python-runtime:
        patterns: ['*']

  - package-ecosystem: swift
    directories:
      - /apps/iOS
      - /packages/heytim-transcription
    schedule:
      interval: weekly
      day: monday
      timezone: America/New_York
    groups:
      swift:
        patterns: ['*']
