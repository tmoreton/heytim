name: Build destination iOS candidate without upload

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Next iOS version (MAJOR.MINOR.PATCH, for example 1.0.13)
        required: true
        type: string

# Share the release lock so two jobs never sign Apple builds at once.
concurrency:
  group: heytim-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-candidate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, macOS, ARM64, heytim-apple]
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add Homebrew build tools to PATH
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"

      - name: Check main and destination candidate
        env:
          GH_TOKEN: ${{ github.token }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          if [[ ! "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'marketing_version must be MAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo 'The iOS candidate must use the current main commit.' >&2
            exit 1
          fi
          latest_tag="$(gh release view --json tagName --jq .tagName)"
          LATEST_TAG="$latest_tag" node --input-type=module <<'NODE'
          const parse = value => {
            const match = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(value);
            if (!match) throw new Error('The latest release does not have a stable version.');
            return match.slice(1).map(Number);
          };
          const latest = parse(process.env.LATEST_TAG);
          const proposed = parse(process.env.MARKETING_VERSION);
          const comparison = proposed.findIndex((part, index) => part !== latest[index]);
          if (comparison < 0 || proposed[comparison] < latest[comparison]) {
            throw new Error('The candidate version must be newer than the latest published release.');
          }
          NODE
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const target = JSON.parse(readFileSync('agentcore/aws-targets.json', 'utf8'))
            .find(item => item.name === 'production');
          const output = JSON.parse(readFileSync(
            'services/API/amplify_outputs.production-candidate.json', 'utf8'));
          const expected = {
            account: '820323452649',
            region: 'us-east-1',
            api: 'https://srrkqsqrqd.execute-api.us-east-1.amazonaws.com',
            pool: 'us-east-1_biJejrNQF',
          };
          if (target?.account !== expected.account || target?.region !== expected.region
            || output.auth?.aws_region !== expected.region
            || output.auth?.user_pool_id !== expected.pool
            || !output.auth?.user_pool_client_id
            || output.custom?.environment !== 'production'
            || output.custom?.apiUrl !== expected.api
            || !output.custom?.githubDeployRoleArn?.startsWith(
              `arn:aws:iam::${expected.account}:role/`)
            || output.custom?.filesBucketName !==
              `heytim-production-user-files-${expected.account}-${expected.region}`) {
            throw new Error('The committed candidate does not identify the approved destination account.');
          }
          NODE

      - name: Stage destination client configuration in this runner
        run: |
          cp services/API/amplify_outputs.production-candidate.json \
            services/API/amplify_outputs.json
          npm --prefix services/API run outputs:apple
          npm --prefix services/API run outputs:apple:production:check

      - name: Cache native transcription assets
        uses: actions/cache@v6
        with:
          path: packages/heytim-transcription/ios/Generated
          key: heytim-nemotron-apple-v3

      - name: Select unique iOS build number
        id: build
        run: echo "number=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Verify iPhone and Mac, then export signed iPhone IPA locally
        env:
          APPLE_TEAM_ID: ${{ vars.HEYTIM_APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.HEYTIM_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.HEYTIM_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.FROGBOT_APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.FROGBOT_APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.FROGBOT_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.FROGBOT_APPLE_DEVELOPMENT_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.FROGBOT_APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          HEYTIM_RELEASE_SCOPE: ios-preflight
          HEYTIM_BUILD_NUMBER: ${{ steps.build.outputs.number }}
          HEYTIM_MARKETING_VERSION: ${{ inputs.marketing_version }}
          HEYTIM_DERIVED_DATA_PATH: ${{ runner.temp }}/heytim-ios-candidate-derived-${{ steps.build.outputs.number }}
        run: ./apps/iOS/scripts/testflight-ci.sh

      - name: Verify embedded destination and record ephemeral candidate
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          shopt -s nullglob
          ipas=(apps/iOS/Archives/Preflight-iOS-"$BUILD_NUMBER"/*.ipa)
          if (( ${#ipas[@]} != 1 )); then
            echo "Expected exactly one locally exported IPA, found ${#ipas[@]}." >&2
            exit 1
          fi
          source_ipa="${ipas[0]}"
          config_entry="$(unzip -Z1 "$source_ipa" \
            | awk '/^Payload\/[^/]+\.app\/amplify_outputs\.json$/ { print; count++ } END { if (count != 1) exit 1 }')"
          unzip -p "$source_ipa" "$config_entry" | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const output = JSON.parse(readFileSync(0, "utf8"));
            if (output.auth?.user_pool_id !== "us-east-1_biJejrNQF"
              || output.custom?.apiUrl !== "https://srrkqsqrqd.execute-api.us-east-1.amazonaws.com"
              || output.custom?.environment !== "production") {
              throw new Error("The signed IPA does not contain destination production configuration.");
            }
          '
          candidate_dir="$RUNNER_TEMP/heytim-ios-candidate"
          mkdir -p "$candidate_dir"
          export IPA_SHA256="$(shasum -a 256 "$source_ipa" | awk '{print $1}')"
          export IPA_BYTES="$(stat -f '%z' "$source_ipa")"
          receipt="$candidate_dir/receipt.json"
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync(process.argv[1], JSON.stringify({
              version: process.env.MARKETING_VERSION,
              build: process.env.BUILD_NUMBER,
              sourceCommit: process.env.GITHUB_SHA,
              destinationAccount: "820323452649",
              destinationApi: "https://srrkqsqrqd.execute-api.us-east-1.amazonaws.com",
              destinationUserPool: "us-east-1_biJejrNQF",
              ipaSha256: process.env.IPA_SHA256,
              ipaBytes: Number(process.env.IPA_BYTES),
              result: "signed-ipa-exported-locally-not-uploaded",
            }, null, 2) + "\n");
          ' "$receipt"
          chmod 600 "$receipt"
          {
            echo "iOS $MARKETING_VERSION ($BUILD_NUMBER) was exported as a signed IPA for destination verification."
            echo "IPA SHA-256: $IPA_SHA256"
            echo 'The signed IPA stayed on this runner for inspection and was deleted after the job. Nothing was uploaded to App Store Connect or made available in TestFlight.'
            echo 'The full release uploads a new iOS build only after the customer-state migration and cutover gates pass.'
            echo 'This workflow did not publish a Mac build, Sparkle feed, or GitHub Release.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve nonsecret verification receipt
        uses: actions/upload-artifact@v7
        with:
          name: heytim-ios-destination-candidate-${{ steps.build.outputs.number }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/heytim-ios-candidate/receipt.json

      - name: Remove ephemeral signed candidate and archive
        if: ${{ always() }}
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          if [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            for path in \
              "apps/iOS/Archives/Preflight-iOS-$BUILD_NUMBER" \
              "apps/iOS/Archives/HeyTim-iOS-$BUILD_NUMBER.xcarchive" \
              "$RUNNER_TEMP/heytim-ios-candidate-derived-$BUILD_NUMBER"; do
              if [[ -e "$path" ]]; then
                find "$path" -depth -delete
              fi
            done
          fi
          receipt_dir="$RUNNER_TEMP/heytim-ios-candidate"
          if [[ -d "$receipt_dir" ]]; then
            find "$receipt_dir" -depth -delete
          fi
