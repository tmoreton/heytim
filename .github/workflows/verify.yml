name: Verify website, catalog, and services

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: frogbot-app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected verification suites
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, frogbot-ci]
    permissions:
      contents: read
    outputs:
      dependencies: ${{ steps.classify.outputs.dependencies }}
      application: ${{ steps.classify.outputs.application }}
      backend: ${{ steps.classify.outputs.backend }}
      runtime: ${{ steps.classify.outputs.runtime }}
      agentcore: ${{ steps.classify.outputs.agentcore }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Add Homebrew build tools to PATH
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - name: Verify change classifier
        run: node --test scripts/classify-ci-changes.test.mjs
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          node scripts/classify-ci-changes.mjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --event "$EVENT_NAME"
          --output "$GITHUB_OUTPUT"

  dependencies:
    name: Audit production dependencies
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: [self-hosted, macOS, ARM64, frogbot-ci]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - uses: astral-sh/setup-uv@v10.1.0
      - run: ./scripts/audit-dependencies.sh

  application:
    name: Verify public website and catalog
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: [self-hosted, macOS, ARM64, frogbot-ci]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/website
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            apps/website/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Verify application
        run: ../../scripts/verify.sh application

  backend:
    name: Verify application backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, macOS, ARM64, frogbot-ci]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/API
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: services/API/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Verify backend
        run: ../../scripts/verify.sh backend

  runtime:
    name: Verify AgentCore runtime
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: [self-hosted, macOS, ARM64, frogbot-ci]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: services/runtime/uv.lock

      - name: Install AgentCore CLI
        run: npm install --global @aws/agentcore@0.29.0

      - name: Verify locked runtime and deployment boundary
        run: ../../scripts/verify.sh runtime

  agentcore:
    name: Verify AgentCore configuration
    needs: changes
    if: needs.changes.outputs.agentcore == 'true'
    runs-on: [self-hosted, macOS, ARM64, frogbot-ci]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agentcore
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: agentcore/cdk/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: services/runtime/uv.lock

      - name: Install generated CDK dependencies
        run: npm ci --prefix cdk

      - name: Verify configuration and generated wrapper
        run: ../scripts/verify.sh agentcore
