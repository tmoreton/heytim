name: Verify supporting browser client and services

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: frogbot-app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: ./scripts/audit-dependencies.sh

  application:
    name: Verify supporting browser client
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/froggybot
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            apps/froggybot/package-lock.json
            apps/froggybot-browser-viewer/package-lock.json
            packages/froggybot-client/package-lock.json
            packages/froggybot-preview/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ../froggybot-browser-viewer
          npm ci --prefix ../../packages/froggybot-client
          npm ci --prefix ../../packages/froggybot-preview

      - name: Verify application
        run: ../../scripts/verify.sh application

  backend:
    name: Verify application backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/froggybot-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: services/froggybot-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify backend
        run: ../../scripts/verify.sh backend

  runtime:
    name: Verify AgentCore runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/agent-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/agent-runtime/uv.lock

      - name: Install AgentCore CLI
        run: npm install --global @aws/agentcore@0.29.0

      - name: Verify locked runtime and deployment boundary
        run: ../../scripts/verify.sh runtime

  agentcore:
    name: Verify AgentCore configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agentcore
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: agentcore/cdk/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/agent-runtime/uv.lock

      - name: Install generated CDK dependencies
        run: npm ci --prefix cdk

      - name: Verify configuration and generated wrapper
        run: ../scripts/verify.sh agentcore
