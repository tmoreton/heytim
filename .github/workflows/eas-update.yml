name: Publish FroggyBot app

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: frogbot-app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: ./scripts/audit-dependencies.sh

  application:
    name: Verify application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/froggybot
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            apps/froggybot/package-lock.json
            apps/froggybot/amplify/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix amplify

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify application and backend
        run: ../../scripts/verify.sh application

  runtime:
    name: Verify AgentCore runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/agent-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/agent-runtime/uv.lock

      - name: Install AgentCore CLI
        run: npm install --global @aws/agentcore@0.28.1

      - name: Verify locked runtime and deployment boundary
        run: ../../scripts/verify.sh runtime

  agentcore:
    name: Verify AgentCore configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agentcore
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: agentcore/cdk/package-lock.json

      - name: Install generated CDK dependencies
        run: npm ci --prefix cdk

      - name: Verify configuration and generated wrapper
        run: ../scripts/verify.sh agentcore

  publish:
    name: Publish FroggyBot app
    if: github.event_name == 'push'
    needs:
      - dependencies
      - application
      - runtime
      - agentcore
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/froggybot
    steps:
      - name: Check for Expo token
        working-directory: .
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add an EXPO_TOKEN repository secret before publishing updates."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify immutable release source
        working-directory: .
        run: ./scripts/assert-release-ready.sh

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/froggybot/package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build desktop web app
        run: npm run build:web

      - name: Publish desktop web app
        run: eas deploy --prod --environment production --non-interactive

      # Native WebView loads this release's browser viewer from the web host.
      - name: Publish production update
        run: eas update --channel production --environment production --message "main@${{ github.sha }}" --non-interactive

      - name: Verify production security headers
        working-directory: .
        run: |
          for attempt in 1 2 3 4 5; do
            headers="$(curl --fail --silent --show-error --head https://app.froggybot.com)"
            if grep -qi '^content-security-policy:' <<<"$headers" \
              && grep -qi '^x-content-type-options: *nosniff' <<<"$headers" \
              && grep -qi '^referrer-policy:' <<<"$headers"; then
              exit 0
            fi
            sleep 5
          done
          echo "Production security headers are missing after deployment." >&2
          exit 1
