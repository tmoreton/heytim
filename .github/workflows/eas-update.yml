name: Publish FroggyBot app

on:
  push:
    branches:
      - main

concurrency:
  group: frogbot-production-update
  cancel-in-progress: true

jobs:
  update:
    name: Publish iOS update and desktop web app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/froggybot
    steps:
      - name: Check for Expo token
        working-directory: .
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add an EXPO_TOKEN repository secret before publishing updates."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/froggybot/package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish production update
        run: eas update --channel production --environment production --message "main@${{ github.sha }}" --non-interactive

      - name: Build desktop web app
        run: npm run build:web

      - name: Publish desktop web app
        run: eas deploy --prod --environment production --non-interactive
