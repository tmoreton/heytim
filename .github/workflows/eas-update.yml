name: Publish FrogBot OTA update

on:
  push:
    branches:
      - main

concurrency:
  group: frogbot-production-update
  cancel-in-progress: true

jobs:
  update:
    name: Publish production update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frogPhone
    steps:
      - name: Check for Expo token
        working-directory: .
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add an EXPO_TOKEN repository secret before publishing updates."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frogPhone/package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish production update
        run: eas update --channel production --environment production --message "main@${{ github.sha }}" --non-interactive
