name: Check provider contracts

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gmail-api:
    runs-on: [self-hosted, macOS, ARM64, frogbot-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify Gmail API contract
        run: python3 scripts/check-gmail-api-contract.py
