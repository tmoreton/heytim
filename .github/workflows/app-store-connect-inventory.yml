name: Inspect HeyTim TestFlight inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Verify read-only inventory client
        run: node --test scripts/tests/inspect-app-store-connect.test.mjs

      - name: Inspect HeyTim iOS builds and internal group
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ vars.HEYTIM_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.HEYTIM_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.FROGBOT_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: node scripts/inspect-app-store-connect.mjs
