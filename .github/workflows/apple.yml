name: Verify primary SwiftUI apps

on:
  push:
    branches: [main]
    paths:
      - apps/iOS/**
      - packages/frogbot-transcription/**
      - services/API/amplify/functions/api/api-contract.json
      - services/API/scripts/generate-api-contract.mjs
      - scripts/apple-app.sh
      - scripts/verify.sh
      - .github/workflows/apple.yml
  pull_request:
    paths:
      - apps/iOS/**
      - packages/frogbot-transcription/**
      - services/API/amplify/functions/api/api-contract.json
      - services/API/scripts/generate-api-contract.mjs
      - scripts/apple-app.sh
      - scripts/verify.sh
      - .github/workflows/apple.yml
  workflow_dispatch:

concurrency:
  group: frogbot-apple-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  apple:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, frogbot-apple]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Add Homebrew build tools to PATH
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - name: Cache native transcription assets
        uses: actions/cache@v6
        with:
          path: packages/frogbot-transcription/ios/Generated
          key: frogbot-nemotron-apple-v3
      - name: Verify iPhone and Mac app
        run: ./scripts/verify.sh apple
