name: Verify primary SwiftUI apps

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frogbot-apple-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Cache native transcription assets
        uses: actions/cache@v5
        with:
          path: packages/frogbot-transcription/ios/Generated
          key: frogbot-nemotron-apple-v3
      - name: Verify iPhone and Mac app
        run: ./scripts/verify.sh apple
