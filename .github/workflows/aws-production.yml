name: Deploy HeyTim production release
run-name: Deploy HeyTim ${{ github.event.release.tag_name || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_scope:
        description: Choose backend only, backend plus Mac/Sparkle, or the full Apple release
        required: true
        default: full
        type: choice
        options:
          - full
          - backend-only
          - backend-macos
      release_tag:
        description: Existing draft release tag required for backend-macos (vMAJOR.MINOR.PATCH)
        required: false
        type: string

concurrency:
  group: heytim-production-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  draft-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Verify existing backend-Mac draft
        id: draft
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_scope == 'backend-macos' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$MANUAL_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'backend-macos requires release_tag vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          if ! release_id="$(gh release view "$MANUAL_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)" \
            || [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Could not identify the existing draft release.' >&2
            exit 1
          fi
          if ! release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")" \
            || ! jq -e --argjson id "$release_id" --arg tag "$MANUAL_RELEASE_TAG" \
              --arg commit "$GITHUB_SHA" '
              .id == $id and .tag_name == $tag and .target_commitish == $commit
              and .draft == true and .prerelease == false
              and ((.body // "") | contains("<!-- heytim-backend-macos-predeployed -->"))
            ' <<<"$release_json" >/dev/null; then
            echo 'backend-macos requires an unpublished stable draft with the predeployed marker.' >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  deploy:
    if: ${{ github.event_name != 'release' || !contains(github.event.release.body, '<!-- heytim-backend-macos-predeployed -->') }}
    needs: draft-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    outputs:
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release source and version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
          DRAFT_RELEASE_ID: ${{ needs.draft-preflight.outputs.release_id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            if [[ "$RELEASE_DRAFT" == true || "$RELEASE_PRERELEASE" == true ]]; then
              echo 'Only published stable releases deploy production.' >&2
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]] \
              || [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo 'Release tags must be vMAJOR.MINOR.PATCH.' >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            if [[ "$(git rev-parse "$GITHUB_REF^{commit}")" != "$GITHUB_SHA" ]] \
              || ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo 'The release tag must point to a commit on main.' >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual production releases must run from main.' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$RELEASE_SCOPE" == backend-macos ]]; then
            if [[ ! "$MANUAL_RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo 'backend-macos requires release_tag vMAJOR.MINOR.PATCH.' >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            git fetch origin main --tags
            if [[ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]]; then
              echo 'backend-macos must use the current main commit.' >&2
              exit 1
            fi
            tag_commit="$(git rev-parse -q --verify "refs/tags/$MANUAL_RELEASE_TAG^{commit}" || true)"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo 'The draft release tag must point to the current main commit.' >&2
              exit 1
            fi
            if [[ ! "$DRAFT_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo 'The backend-Mac draft preflight did not return a release ID.' >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release branch and production configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN: ${{ vars.HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN }}
          HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN: ${{ vars.HEYTIM_DATA_LAUNCH_MODE == 'fresh' && 'arn:aws:kms:us-east-1:820323452649:key/4893a4c0-00e8-4381-823b-19c8bc8ed248' || vars.HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN }}
          HEYTIM_YOUTUBE_SEARCH_DAILY_LIMIT: ${{ vars.HEYTIM_YOUTUBE_SEARCH_DAILY_LIMIT }}
          HEYTIM_MONTHLY_BUDGET_USD: ${{ vars.HEYTIM_MONTHLY_BUDGET_USD }}
          AGENTCORE_CREDENTIAL_HEYTIM_OPENROUTER: ${{ secrets.AGENTCORE_CREDENTIAL_FROGBOT_OPENROUTER }}
          AGENTCORE_CREDENTIAL_HEYTIMXAPI: ${{ secrets.AGENTCORE_CREDENTIAL_FROGBOTXAPI }}
          AGENTCORE_CREDENTIAL_HEYTIMYOUTUBEAPI: ${{ secrets.AGENTCORE_CREDENTIAL_FROGBOTYOUTUBEAPI }}
          HEYTIM_RELEASE_TEST_REFRESH_TOKEN: ${{ secrets.HEYTIM_RELEASE_TEST_REFRESH_TOKEN }}
          GOOGLE_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_GOOGLE_OAUTH_SECRET_ARN }}
          GITHUB_APP_SECRET_ARN: ${{ secrets.HEYTIM_GITHUB_APP_SECRET_ARN }}
          X_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_X_OAUTH_SECRET_ARN }}
          SLACK_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_SLACK_OAUTH_SECRET_ARN }}
          NOTION_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_NOTION_OAUTH_SECRET_ARN }}
          STRIPE_SECRET_KEY: ${{ vars.HEYTIM_BILLING_MODE == 'stripe' && secrets.HEYTIM_STRIPE_SECRET_KEY || '' }}
          STRIPE_WEBHOOK_SECRET: ${{ vars.HEYTIM_BILLING_MODE == 'stripe' && secrets.HEYTIM_STRIPE_WEBHOOK_SECRET || '' }}
          STRIPE_PLUS_PRICE_ID: ${{ vars.HEYTIM_BILLING_MODE == 'stripe' && vars.HEYTIM_STRIPE_PLUS_PRICE_ID || '' }}
          STRIPE_LIVE_MODE: ${{ vars.HEYTIM_BILLING_MODE == 'stripe' && vars.HEYTIM_STRIPE_LIVE_MODE || 'false' }}
          BILLING_MODE: ${{ vars.HEYTIM_BILLING_MODE }}
          APNS_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_APPLICATION_ARN }}
          APNS_SANDBOX_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_SANDBOX_APPLICATION_ARN }}
          GOOGLE_REVIEW_APPROVED: ${{ vars.HEYTIM_GOOGLE_REVIEW_APPROVED }}
          GOOGLE_CONNECTIONS_ENABLED: ${{ vars.HEYTIM_GOOGLE_CONNECTIONS_ENABLED || 'true' }}
          GOOGLE_WORKSPACE_REVIEW_APPROVED: ${{ vars.HEYTIM_GOOGLE_WORKSPACE_REVIEW_APPROVED || 'false' }}
          GOOGLE_WORKSPACE_CONNECTIONS_ENABLED: ${{ vars.HEYTIM_GOOGLE_WORKSPACE_CONNECTIONS_ENABLED || 'false' }}
          SLACK_CONNECTIONS_ENABLED: ${{ vars.HEYTIM_SLACK_CONNECTIONS_ENABLED || 'true' }}
          NOTION_CONNECTIONS_ENABLED: ${{ vars.HEYTIM_NOTION_CONNECTIONS_ENABLED || 'true' }}
          X_CONNECTIONS_ENABLED: ${{ vars.HEYTIM_X_CONNECTIONS_ENABLED || 'true' }}
          SLACK_REVIEW_APPROVED: ${{ vars.HEYTIM_SLACK_REVIEW_APPROVED }}
          X_REVIEW_APPROVED: ${{ vars.HEYTIM_X_REVIEW_APPROVED }}
          NOTION_REVIEW_APPROVED: ${{ vars.HEYTIM_NOTION_REVIEW_APPROVED }}
          ACCOUNT_ISOLATION_CUTOVER_APPROVED: ${{ vars.HEYTIM_ACCOUNT_ISOLATION_CUTOVER_APPROVED }}
          DATA_LAUNCH_MODE: ${{ vars.HEYTIM_DATA_LAUNCH_MODE }}
          FRESH_ACCOUNT_LAUNCH_APPROVED: ${{ vars.HEYTIM_FRESH_ACCOUNT_LAUNCH_APPROVED }}
          DESTINATION_ACCOUNT_ID: ${{ vars.HEYTIM_DESTINATION_ACCOUNT_ID }}
          RELEASE_COMPLIANCE_APPROVED: ${{ vars.HEYTIM_RELEASE_COMPLIANCE_APPROVED }}
          APNS_DEVICE_SMOKE_APPROVED: ${{ vars.HEYTIM_APNS_DEVICE_SMOKE_APPROVED }}
          APPLE_TEAM_ID: ${{ vars.HEYTIM_APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.HEYTIM_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.HEYTIM_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.FROGBOT_APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.FROGBOT_APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.FROGBOT_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.FROGBOT_APPLE_DEVELOPMENT_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.FROGBOT_APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.HEYTIM_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.HEYTIM_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          HEYTIM_MAC_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.HEYTIM_MAC_DEVELOPER_ID_PROFILE_BASE64 }}
          HEYTIM_SPARKLE_PUBLIC_KEY: ${{ vars.HEYTIM_SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.HEYTIM_SPARKLE_PRIVATE_KEY }}
          RELEASE_SCOPE: ${{ github.event_name == 'release' && 'full' || inputs.release_scope }}
        run: |
          if [[ "$RELEASE_SCOPE" != full && "$RELEASE_SCOPE" != backend-only \
            && "$RELEASE_SCOPE" != backend-macos ]]; then
            echo 'release_scope must be full, backend-only, or backend-macos.' >&2
            exit 1
          fi
          if [[ "$DATA_LAUNCH_MODE" != fresh && "$DATA_LAUNCH_MODE" != migrate ]]; then
            echo 'HEYTIM_DATA_LAUNCH_MODE must be fresh or migrate.' >&2
            exit 1
          fi
          if [[ "$BILLING_MODE" != free && "$BILLING_MODE" != stripe ]]; then
            echo 'HEYTIM_BILLING_MODE must be free or stripe.' >&2
            exit 1
          fi
          required_values=(
            AWS_DEPLOY_ROLE_ARN AMPLIFY_APP_ID
            HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN
            HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN
            HEYTIM_YOUTUBE_SEARCH_DAILY_LIMIT HEYTIM_MONTHLY_BUDGET_USD
            AGENTCORE_CREDENTIAL_HEYTIM_OPENROUTER
            AGENTCORE_CREDENTIAL_HEYTIMXAPI AGENTCORE_CREDENTIAL_HEYTIMYOUTUBEAPI
            HEYTIM_RELEASE_TEST_REFRESH_TOKEN
            GOOGLE_OAUTH_SECRET_ARN GITHUB_APP_SECRET_ARN X_OAUTH_SECRET_ARN
            SLACK_OAUTH_SECRET_ARN NOTION_OAUTH_SECRET_ARN APNS_APPLICATION_ARN
          )
          if [[ "$RELEASE_SCOPE" == full ]]; then
            required_values+=(
              APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID
              APP_STORE_CONNECT_PRIVATE_KEY APPLE_DISTRIBUTION_CERTIFICATE_BASE64
              APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
              APPLE_DEVELOPMENT_CERTIFICATE_BASE64 APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD
              DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64
              DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD
              HEYTIM_MAC_DEVELOPER_ID_PROFILE_BASE64
              HEYTIM_SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY
            )
          elif [[ "$RELEASE_SCOPE" == backend-macos ]]; then
            required_values+=(
              APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID
              APP_STORE_CONNECT_PRIVATE_KEY APPLE_DEVELOPMENT_CERTIFICATE_BASE64
              APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64
              DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD
              HEYTIM_MAC_DEVELOPER_ID_PROFILE_BASE64
              HEYTIM_SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY
            )
          fi
          missing=()
          for name in "${required_values[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "$RELEASE_SCOPE" == full || "$RELEASE_SCOPE" == backend-macos ]]; then
            if ! sparkle_public_key_size="$(printf '%s' "$HEYTIM_SPARKLE_PUBLIC_KEY" \
              | base64 --decode 2>/dev/null | wc -c | tr -d ' ')" \
              || [[ "$sparkle_public_key_size" != 32 ]]; then
              echo 'HEYTIM_SPARKLE_PUBLIC_KEY must be a base64-encoded 32-byte Ed25519 public key.' >&2
              exit 1
            fi
            if ! printf '%s' "$HEYTIM_MAC_DEVELOPER_ID_PROFILE_BASE64" \
              | base64 --decode 2>/dev/null \
              | openssl cms -verify -inform DER -noverify -out /dev/null >/dev/null 2>&1; then
              echo 'The Mac Developer ID provisioning profile is not valid signed CMS data.' >&2
              exit 1
            fi
          fi
          if [[ "$DATA_LAUNCH_MODE" == fresh ]]; then
            configured_account="$(jq -r '.[] | select(.name == "production") | .account' agentcore/aws-targets.json)"
            if [[ "$FRESH_ACCOUNT_LAUNCH_APPROVED" != true \
              || "$ACCOUNT_ISOLATION_CUTOVER_APPROVED" == true \
              || "$DESTINATION_ACCOUNT_ID" != 820323452649 \
              || "$configured_account" != "$DESTINATION_ACCOUNT_ID" \
              || "$AWS_DEPLOY_ROLE_ARN" != "arn:aws:iam::$DESTINATION_ACCOUNT_ID:role/"* \
              || "$AMPLIFY_APP_ID" != d17sj7dvhx07c \
              || "$APNS_APPLICATION_ARN" != 'arn:aws:sns:us-east-1:820323452649:app/APNS/HeyTim' \
              || "$APNS_SANDBOX_APPLICATION_ARN" != 'arn:aws:sns:us-east-1:820323452649:app/APNS_SANDBOX/HeyTim' ]]; then
              echo 'Fresh launch needs its own approval, destination account/role/app, and destination APNS applications. It must not reuse migration approval or source resources.' >&2
              exit 1
            fi
            if [[ "$HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN" \
              != 'arn:aws:kms:us-east-1:820323452649:key/4893a4c0-00e8-4381-823b-19c8bc8ed248' ]]; then
              echo 'Fresh launch must use the destination AgentCore Identity KMS key.' >&2
              exit 1
            fi
          elif [[ "$ACCOUNT_ISOLATION_CUTOVER_APPROVED" != true \
            || "$FRESH_ACCOUNT_LAUNCH_APPROVED" == true ]]; then
            echo 'Migration launch needs the account-isolation cutover approval and must not reuse the fresh-launch approval.' >&2
            exit 1
          fi
          stripe_values=(STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PLUS_PRICE_ID)
          stripe_value_count=0
          for name in "${stripe_values[@]}"; do
            [[ -n "${!name}" ]] && ((stripe_value_count += 1))
          done
          if [[ "$BILLING_MODE" == free ]]; then
            if (( stripe_value_count != 0 )) || [[ "$STRIPE_LIVE_MODE" != false ]]; then
              echo 'Free launch must pass no Stripe key, webhook secret, or Price ID and must disable live mode.' >&2
              exit 1
            fi
          elif [[ "$STRIPE_LIVE_MODE" != true && "$STRIPE_LIVE_MODE" != false ]]; then
            echo 'HEYTIM_STRIPE_LIVE_MODE must be true or false.' >&2
            exit 1
          fi
          if [[ "$BILLING_MODE" == stripe \
            && "$stripe_value_count" != "${#stripe_values[@]}" ]]; then
            echo 'Stripe billing requires its API key, webhook secret, and Plus Price ID together.' >&2
            exit 1
          fi
          if (( stripe_value_count == ${#stripe_values[@]} )); then
            stripe_mode='test'
            [[ "$STRIPE_LIVE_MODE" == true ]] && stripe_mode='live'
            if [[ "$STRIPE_SECRET_KEY" != sk_${stripe_mode}_* \
              && "$STRIPE_SECRET_KEY" != rk_${stripe_mode}_* ]]; then
              echo "Stripe API key is not a valid $stripe_mode key." >&2
              exit 1
            fi
            if [[ "$STRIPE_WEBHOOK_SECRET" != whsec_* ]]; then
              echo 'Stripe webhook signing secret is invalid.' >&2
              exit 1
            fi
            if [[ "$STRIPE_PLUS_PRICE_ID" != price_* ]]; then
              echo 'Stripe Plus Price ID is invalid.' >&2
              exit 1
            fi
          fi
          for provider in GOOGLE SLACK NOTION X; do
            enabled_name="${provider}_CONNECTIONS_ENABLED"
            approved_name="${provider}_REVIEW_APPROVED"
            if [[ "${!enabled_name}" != true && "${!enabled_name}" != false ]]; then
              echo "HEYTIM_$enabled_name must be true or false." >&2
              exit 1
            fi
            if [[ "${!enabled_name}" == true && "${!approved_name}" != true ]]; then
              echo "$provider review must be approved while its connections are enabled." >&2
              exit 1
            fi
          done
          if [[ "$GOOGLE_WORKSPACE_CONNECTIONS_ENABLED" != true \
            && "$GOOGLE_WORKSPACE_CONNECTIONS_ENABLED" != false ]]; then
            echo 'HEYTIM_GOOGLE_WORKSPACE_CONNECTIONS_ENABLED must be true or false.' >&2
            exit 1
          fi
          if [[ "$GOOGLE_WORKSPACE_CONNECTIONS_ENABLED" == true \
            && ( "$GOOGLE_CONNECTIONS_ENABLED" != true \
              || "$GOOGLE_WORKSPACE_REVIEW_APPROVED" != true ) ]]; then
            echo 'Google Workspace requires Google connections and separate Workspace review approval.' >&2
            exit 1
          fi
          attestations=()
          if [[ "$DATA_LAUNCH_MODE" != fresh || "$RELEASE_SCOPE" != backend-only ]]; then
            attestations+=(RELEASE_COMPLIANCE_APPROVED APNS_DEVICE_SMOKE_APPROVED)
          fi
          for name in "${attestations[@]}"; do
            if [[ "${!name}" != true ]]; then
              echo "$name must be set to true after its release checklist item is complete." >&2
              exit 1
            fi
          done
          if [[ "$RELEASE_SCOPE" == full ]]; then
            if ! printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" \
              | openssl pkey -check -noout >/dev/null 2>&1; then
              echo 'HEYTIM_APP_STORE_CONNECT_PRIVATE_KEY is not a valid private key.' >&2
              exit 1
            fi
            certificate_bundle="$RUNNER_TEMP/heytim-distribution.p12"
            development_bundle="$RUNNER_TEMP/heytim-development.p12"
            trap 'find "$certificate_bundle" "$development_bundle" -delete 2>/dev/null || true' EXIT
            if ! printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" \
              | base64 --decode > "$certificate_bundle"; then
              echo 'HEYTIM_APPLE_DISTRIBUTION_CERTIFICATE_BASE64 is not valid base64.' >&2
              exit 1
            fi
            if ! openssl pkcs12 -in "$certificate_bundle" \
              -passin env:APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD -clcerts -nokeys 2>/dev/null \
              | openssl x509 -checkend 86400 -noout >/dev/null 2>&1; then
              echo 'The Apple Distribution certificate is invalid, expired, or expires within 24 hours.' >&2
              exit 1
            fi
            if ! openssl pkcs12 -in "$certificate_bundle" \
              -passin env:APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD -nocerts -nodes 2>/dev/null \
              | openssl pkey -check -noout >/dev/null 2>&1; then
              echo 'The Apple Distribution certificate bundle does not contain its private key.' >&2
              exit 1
            fi
            if ! openssl pkcs12 -in "$certificate_bundle" \
              -passin env:APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD -clcerts -nokeys 2>/dev/null \
              | openssl x509 -subject -noout 2>/dev/null | grep -q 'Apple Distribution'; then
              echo 'The supplied certificate is not an Apple Distribution certificate.' >&2
              exit 1
            fi
            if ! printf '%s' "$APPLE_DEVELOPMENT_CERTIFICATE_BASE64" \
              | base64 --decode > "$development_bundle"; then
              echo 'HEYTIM_APPLE_DEVELOPMENT_CERTIFICATE_BASE64 is not valid base64.' >&2
              exit 1
            fi
            if ! openssl pkcs12 -in "$development_bundle" \
              -passin env:APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD -clcerts -nokeys 2>/dev/null \
              | openssl x509 -checkend 86400 -noout >/dev/null 2>&1; then
              echo 'The Apple Development certificate is invalid or expires within 24 hours.' >&2
              exit 1
            fi
            if ! openssl pkcs12 -in "$development_bundle" \
              -passin env:APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD -nocerts -nodes 2>/dev/null \
              | openssl pkey -check -noout >/dev/null 2>&1; then
              echo 'The Apple Development certificate bundle does not contain its private key.' >&2
              exit 1
            fi
            if ! openssl pkcs12 -in "$development_bundle" \
              -passin env:APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD -clcerts -nokeys 2>/dev/null \
              | openssl x509 -subject -noout 2>/dev/null | grep -q 'Apple Development'; then
              echo 'The supplied certificate is not an Apple Development certificate.' >&2
              exit 1
            fi
            find "$certificate_bundle" "$development_bundle" -delete
            trap - EXIT
          fi
          node scripts/check-production-config.mjs

      - name: Resolve production AWS target
        id: target
        run: |
          echo "account=$(jq -r '.[] | select(.name == "production") | .account' agentcore/aws-targets.json)" >> "$GITHUB_OUTPUT"
          echo "region=$(jq -r '.[] | select(.name == "production") | .region' agentcore/aws-targets.json)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.target.outputs.region }}

      - name: Verify immutable non-root release source and account
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          DATA_LAUNCH_MODE: ${{ vars.HEYTIM_DATA_LAUNCH_MODE }}
        run: |
          ./scripts/assert-release-ready.sh --aws
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$actual_account" != "${{ steps.target.outputs.account }}" ]]; then
            echo "Deployment role resolved to AWS account $actual_account instead of the configured production account." >&2
            exit 1
          fi
          if [[ "$DATA_LAUNCH_MODE" == fresh ]]; then
            actual_app="$(aws amplify get-app --app-id "$AMPLIFY_APP_ID" --query 'app.appId' --output text)"
            if [[ "$actual_app" != "$AMPLIFY_APP_ID" ]]; then
              echo 'The destination Amplify app was not found in the dedicated production account.' >&2
              exit 1
            fi
          fi

      - name: Preserve standalone destination mail capture ownership
        env:
          DATA_LAUNCH_MODE: ${{ vars.HEYTIM_DATA_LAUNCH_MODE }}
        run: |
          error_file="$RUNNER_TEMP/heytim-mail-capture-stack-check.err"
          if [[ "$DATA_LAUNCH_MODE" == fresh ]]; then
            stack_status="$(aws cloudformation describe-stacks \
              --stack-name HeyTimDestinationMailCapture \
              --query 'Stacks[0].StackStatus' --output text)"
            capture_bucket="$(aws cloudformation describe-stacks \
              --stack-name HeyTimDestinationMailCapture \
              --query 'Stacks[0].Outputs[?OutputKey==`BotEmailQuarantineBucketName`].OutputValue | [0]' \
              --output text)"
            if [[ "$stack_status" != CREATE_COMPLETE && "$stack_status" != UPDATE_COMPLETE ]] \
              || [[ ! "$capture_bucket" =~ ^heytimdestinationmailcapt-botemailquarantine[a-z0-9-]+$ ]]; then
              echo 'The destination standalone mail capture stack or quarantine bucket is not ready.' >&2
              exit 1
            fi
            echo "HEYTIM_BOT_EMAIL_STANDALONE_CAPTURE_BUCKET=$capture_bucket" >> "$GITHUB_ENV"
            exit 0
          fi
          if aws cloudformation describe-stacks \
            --stack-name HeyTimDestinationMailCapture \
            --query 'Stacks[0].StackStatus' --output text 2>"$error_file" >/dev/null; then
            echo 'Standalone destination mail capture is active; reconcile its queues, MIME, and SES rule before a full Amplify release.' >&2
            exit 1
          fi
          if ! grep -qE 'ValidationError.*HeyTimDestinationMailCapture.*does not exist' "$error_file"; then
            echo 'Could not prove the standalone destination mail capture stack is absent.' >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            services/API/package-lock.json
            agentcore/cdk/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: services/runtime/uv.lock

      - name: Install production dependencies
        run: |
          npm ci --prefix services/API
          npm ci --prefix agentcore/cdk
          npm install --global @aws/agentcore@0.29.0

      - name: Verify production services
        run: ./scripts/verify.sh server

      - name: Audit production dependencies
        run: ./scripts/audit-dependencies.sh

      - name: Use repository-managed AgentCore CDK dependencies
        run: agentcore config disableDependencyManagement true

      - name: Deploy AgentCore production target
        env:
          HEYTIM_ENVIRONMENT: production
          HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN: ${{ vars.HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN }}
          HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN: ${{ vars.HEYTIM_DATA_LAUNCH_MODE == 'fresh' && 'arn:aws:kms:us-east-1:820323452649:key/4893a4c0-00e8-4381-823b-19c8bc8ed248' || vars.HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN }}
          AGENTCORE_CREDENTIAL_HEYTIM_OPENROUTER: ${{ secrets.AGENTCORE_CREDENTIAL_FROGBOT_OPENROUTER }}
          AGENTCORE_CREDENTIAL_HEYTIMXAPI: ${{ secrets.AGENTCORE_CREDENTIAL_FROGBOTXAPI }}
          AGENTCORE_CREDENTIAL_HEYTIMYOUTUBEAPI: ${{ secrets.AGENTCORE_CREDENTIAL_FROGBOTYOUTUBEAPI }}
        run: |
          umask 077
          {
            printf 'AGENTCORE_CREDENTIAL_HEYTIM_OPENROUTER=%s\n' "$AGENTCORE_CREDENTIAL_HEYTIM_OPENROUTER"
            printf 'AGENTCORE_CREDENTIAL_HEYTIMXAPI=%s\n' "$AGENTCORE_CREDENTIAL_HEYTIMXAPI"
            printf 'AGENTCORE_CREDENTIAL_HEYTIMYOUTUBEAPI=%s\n' "$AGENTCORE_CREDENTIAL_HEYTIMYOUTUBEAPI"
          } > agentcore/.env.local
          trap 'rm -f agentcore/.env.local' EXIT
          agentcore deploy --target production --yes

      - name: Resolve deployed AgentCore resources
        run: |
          agentcore status --target production --json > /tmp/heytim-production-status.json
          target='.deployedState.targets.production.resources'
          runtime_arn="$(jq -r "$target.runtimes.HeyTim.runtimeArn // empty" /tmp/heytim-production-status.json)"
          memory_arn="$(jq -r "$target.memories.HeyTimMemory.memoryArn // empty" /tmp/heytim-production-status.json)"
          gateway_arn="$(jq -r "$target.mcp.gateways.HeyTimTools.gatewayArn // empty" /tmp/heytim-production-status.json)"
          gateway_id="$(jq -r "$target.mcp.gateways.HeyTimTools.gatewayId // empty" /tmp/heytim-production-status.json)"
          gateway_url="$(jq -r "$target.mcp.gateways.HeyTimTools.gatewayUrl // empty" /tmp/heytim-production-status.json)"
          dataset_id="$(jq -r "$target.datasets.HeyTimRegression.datasetId // empty" /tmp/heytim-production-status.json)"
          if [[ "$runtime_arn" != arn:aws:bedrock-agentcore:* ]] \
            || [[ "$memory_arn" != arn:aws:bedrock-agentcore:* ]] \
            || [[ "$gateway_arn" != arn:aws:bedrock-agentcore:* ]] \
            || [[ -z "$gateway_id" ]] \
            || [[ -z "$dataset_id" ]] \
            || [[ "$gateway_url" != https://*.gateway.bedrock-agentcore.*.amazonaws.com/mcp ]]; then
            echo 'AgentCore production resources are not ready.' >&2
            exit 1
          fi
          echo "HEYTIM_AGENT_RUNTIME_ARN=$runtime_arn" >> "$GITHUB_ENV"
          echo "HEYTIM_MEMORY_ID=${memory_arn##*/}" >> "$GITHUB_ENV"
          echo "HEYTIM_AGENT_GATEWAY_ARN=$gateway_arn" >> "$GITHUB_ENV"
          echo "HEYTIM_AGENT_GATEWAY_ID=$gateway_id" >> "$GITHUB_ENV"
          echo "HEYTIM_AGENT_GATEWAY_URL=$gateway_url" >> "$GITHUB_ENV"
          echo "HEYTIM_REGRESSION_DATASET_ID=$dataset_id" >> "$GITHUB_ENV"

      - name: Deploy Amplify production backend
        working-directory: services/API
        env:
          HEYTIM_ENVIRONMENT: production
          HEYTIM_RELEASE_SYNTHETIC_CONSENT_READ: ${{ vars.HEYTIM_DATA_LAUNCH_MODE == 'fresh' && 'true' || 'false' }}
          HEYTIM_AUTH_EMAIL_PROVIDER: ses
          HEYTIM_BOT_EMAIL_STAGE: receive
          HEYTIM_BOT_EMAIL_CAPTURE_ONLY: ${{ vars.HEYTIM_DATA_LAUNCH_MODE == 'fresh' && 'true' || 'false' }}
          HEYTIM_BOT_EMAIL_KEEP_HELD_SUBSCRIBER: ${{ vars.HEYTIM_DATA_LAUNCH_MODE == 'fresh' && 'true' || 'false' }}
          HEYTIM_BOT_EMAIL_AVAILABLE: ${{ vars.HEYTIM_DATA_LAUNCH_MODE == 'fresh' && 'false' || 'true' }}
          HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN: ${{ vars.HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN }}
          HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN: ${{ vars.HEYTIM_DATA_LAUNCH_MODE == 'fresh' && 'arn:aws:kms:us-east-1:820323452649:key/4893a4c0-00e8-4381-823b-19c8bc8ed248' || vars.HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN }}
          HEYTIM_GOOGLE_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_GOOGLE_OAUTH_SECRET_ARN }}
          HEYTIM_GOOGLE_CONNECTIONS_ENABLED: ${{ vars.HEYTIM_GOOGLE_CONNECTIONS_ENABLED || 'true' }}
          HEYTIM_GOOGLE_WORKSPACE_CONNECTIONS_ENABLED: ${{ vars.HEYTIM_GOOGLE_WORKSPACE_CONNECTIONS_ENABLED || 'false' }}
          HEYTIM_SLACK_CONNECTIONS_ENABLED: ${{ vars.HEYTIM_SLACK_CONNECTIONS_ENABLED || 'true' }}
          HEYTIM_NOTION_CONNECTIONS_ENABLED: ${{ vars.HEYTIM_NOTION_CONNECTIONS_ENABLED || 'true' }}
          HEYTIM_X_CONNECTIONS_ENABLED: ${{ vars.HEYTIM_X_CONNECTIONS_ENABLED || 'true' }}
          HEYTIM_GITHUB_APP_SECRET_ARN: ${{ secrets.HEYTIM_GITHUB_APP_SECRET_ARN }}
          HEYTIM_X_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_X_OAUTH_SECRET_ARN }}
          HEYTIM_SLACK_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_SLACK_OAUTH_SECRET_ARN }}
          HEYTIM_NOTION_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_NOTION_OAUTH_SECRET_ARN }}
          HEYTIM_MICROSOFT_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_MICROSOFT_OAUTH_SECRET_ARN }}
          HEYTIM_HUBSPOT_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_HUBSPOT_OAUTH_SECRET_ARN }}
          HEYTIM_JIRA_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_JIRA_OAUTH_SECRET_ARN }}
          HEYTIM_ZOOM_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_ZOOM_OAUTH_SECRET_ARN }}
          HEYTIM_QUICKBOOKS_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_QUICKBOOKS_OAUTH_SECRET_ARN }}
          HEYTIM_PLAID_SECRET_ARN: ${{ vars.HEYTIM_DATA_LAUNCH_MODE == 'migrate' && secrets.HEYTIM_PLAID_SECRET_ARN || '' }}
          HEYTIM_BILLING_MODE: ${{ vars.HEYTIM_BILLING_MODE }}
          HEYTIM_FREE_ONLY_MODE: ${{ vars.HEYTIM_DATA_LAUNCH_MODE == 'fresh' && vars.HEYTIM_BILLING_MODE == 'free' && 'true' || 'false' }}
          HEYTIM_STRIPE_SECRET_ID: ${{ vars.HEYTIM_BILLING_MODE == 'stripe' && vars.HEYTIM_STRIPE_PLUS_PRICE_ID != '' && 'heytim/stripe/production' || '' }}
          HEYTIM_STRIPE_PLUS_PRICE_ID: ${{ vars.HEYTIM_BILLING_MODE == 'stripe' && vars.HEYTIM_STRIPE_PLUS_PRICE_ID || '' }}
          HEYTIM_STRIPE_LIVE_MODE: ${{ vars.HEYTIM_BILLING_MODE == 'stripe' && vars.HEYTIM_STRIPE_LIVE_MODE || 'false' }}
          HEYTIM_STRIPE_AUTOMATIC_TAX: ${{ vars.HEYTIM_BILLING_MODE == 'stripe' && vars.HEYTIM_STRIPE_AUTOMATIC_TAX || 'false' }}
          HEYTIM_FREE_MONTHLY_CREDITS: ${{ vars.HEYTIM_FREE_MONTHLY_CREDITS || '30' }}
          HEYTIM_PLUS_MONTHLY_CREDITS: ${{ vars.HEYTIM_PLUS_MONTHLY_CREDITS || '300' }}
          HEYTIM_PLUS_PRICE_CENTS: ${{ vars.HEYTIM_PLUS_PRICE_CENTS || '2000' }}
          HEYTIM_YOUTUBE_SEARCH_DAILY_LIMIT: ${{ vars.HEYTIM_YOUTUBE_SEARCH_DAILY_LIMIT }}
          HEYTIM_MONTHLY_BUDGET_USD: ${{ vars.HEYTIM_MONTHLY_BUDGET_USD }}
          HEYTIM_APNS_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_APPLICATION_ARN }}
          HEYTIM_APNS_SANDBOX_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_SANDBOX_APPLICATION_ARN }}
        run: npx ampx pipeline-deploy --branch main --app-id "${{ vars.AMPLIFY_APP_ID }}" --outputs-out-dir .

      - name: Provision Stripe billing secret
        env:
          STRIPE_SECRET_KEY: ${{ vars.HEYTIM_BILLING_MODE == 'stripe' && secrets.HEYTIM_STRIPE_SECRET_KEY || '' }}
          STRIPE_WEBHOOK_SECRET: ${{ vars.HEYTIM_BILLING_MODE == 'stripe' && secrets.HEYTIM_STRIPE_WEBHOOK_SECRET || '' }}
          STRIPE_PLUS_PRICE_ID: ${{ vars.HEYTIM_BILLING_MODE == 'stripe' && vars.HEYTIM_STRIPE_PLUS_PRICE_ID || '' }}
        run: |
          if [[ -z "$STRIPE_SECRET_KEY" && -z "$STRIPE_WEBHOOK_SECRET" && -z "$STRIPE_PLUS_PRICE_ID" ]]; then
            exit 0
          fi
          secret_name='heytim/stripe/production'
          secret_value="$(jq -nc \
            --arg secretKey "$STRIPE_SECRET_KEY" \
            --arg webhookSecret "$STRIPE_WEBHOOK_SECRET" \
            '{secretKey:$secretKey,webhookSecret:$webhookSecret}')"
          for attempt in {1..6}; do
            if secret_arn="$(aws secretsmanager describe-secret \
              --secret-id "$secret_name" --query ARN --output text 2>/dev/null)"; then
              aws secretsmanager put-secret-value \
                --secret-id "$secret_arn" --secret-string "$secret_value" >/dev/null && exit 0
            elif aws secretsmanager create-secret \
              --name "$secret_name" \
              --description 'Stripe server and webhook credentials for HeyTim billing.' \
              --secret-string "$secret_value" >/dev/null 2>&1; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo 'Could not provision the Stripe billing secret after the deployment role update.' >&2
          exit 1

      - name: Deploy external research gateway targets
        run: ./scripts/deploy-external-gateway-targets.sh

      - name: Smoke test X and YouTube research
        working-directory: services/runtime
        run: uv run --frozen python scripts/smoke_external_gateway.py

      - name: Generate release client configuration
        working-directory: services/API
        run: npm run outputs:apple

      - name: Ensure production meme template catalog
        working-directory: services/runtime
        run: |
          outputs='../API/amplify_outputs.json'
          config='../../agentcore/agentcore.json'
          bucket="$(jq -r '.custom.filesBucketName // empty' "$outputs")"
          prefix="$(jq -r '.runtimes[] | select(.name == "HeyTim") | .envVars[] | select(.name == "HEYTIM_MEME_TEMPLATE_PREFIX") | .value' "$config")"
          if [[ -z "$bucket" || -z "$prefix" ]]; then
            echo 'Production meme-template storage configuration is missing.' >&2
            exit 1
          fi
          catalog_key="${prefix%/}/catalog.json"
          if aws s3api head-object --bucket "$bucket" --key "$catalog_key" >/dev/null 2>&1; then
            echo "Meme template catalog already exists at s3://$bucket/$catalog_key."
          else
            uv run --frozen python scripts/sync_meme_templates.py \
              --bucket "$bucket" \
              --prefix "$prefix"
          fi

      - name: Resolve production observability outputs
        run: |
          output() { jq -r ".custom.$1 // empty" services/API/amplify_outputs.json; }
          logs_key_arn="$(output logsKeyArn)"
          alarm_topic_arn="$(output alarmTopicArn)"
          feedback_role_arn="$(output nativePushFeedbackRoleArn)"
          if [[ "$logs_key_arn" != arn:aws:kms:* ]] \
            || [[ "$alarm_topic_arn" != arn:aws:sns:* ]] \
            || [[ "$feedback_role_arn" != arn:aws:iam::* ]]; then
            echo 'One or more production observability outputs are missing.' >&2
            exit 1
          fi
          echo "HEYTIM_LOGS_KMS_KEY_ARN=$logs_key_arn" >> "$GITHUB_ENV"
          echo "HEYTIM_ALARM_TOPIC_ARN=$alarm_topic_arn" >> "$GITHUB_ENV"
          echo "HEYTIM_NATIVE_PUSH_FEEDBACK_ROLE_ARN=$feedback_role_arn" >> "$GITHUB_ENV"

      - name: Configure runtime logs, alarms, and push feedback
        env:
          HEYTIM_APNS_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_APPLICATION_ARN }}
          HEYTIM_APNS_SANDBOX_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_SANDBOX_APPLICATION_ARN }}
        run: |
          ./scripts/harden-agentcore-logs.sh
          ./scripts/configure-agentcore-observability.sh
          ./scripts/configure-native-push-feedback.sh

      - name: Verify deployed production resources
        env:
          HEYTIM_APNS_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_APPLICATION_ARN }}
          HEYTIM_APNS_SANDBOX_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_SANDBOX_APPLICATION_ARN }}
        run: ./scripts/verify-production-deployment.sh

      - name: Prepare permission for the dedicated synthetic release user
        working-directory: services/runtime
        env:
          HEYTIM_RELEASE_TEST_REFRESH_TOKEN: ${{ secrets.HEYTIM_RELEASE_TEST_REFRESH_TOKEN }}
        run: |
          client_id="$(jq -r '.auth.user_pool_client_id // empty' ../API/amplify_outputs.json)"
          if [[ -z "$client_id" ]]; then
            echo 'Destination Cognito client ID is missing.' >&2
            exit 1
          fi
          uv run --frozen python scripts/prepare_managed_regression_consent.py \
            --client-id "$client_id" \
            --output "$RUNNER_TEMP/heytim-release-consent.json"

      - name: Gate release on the managed AgentCore regression dataset
        working-directory: services/runtime
        run: |
          result="$RUNNER_TEMP/heytim-release-evaluation/result.json"
          mkdir -p "$(dirname "$result")"
          uv run --frozen python scripts/run_managed_regression.py \
            --runtime-arn "$HEYTIM_AGENT_RUNTIME_ARN" \
            --dataset-id "$HEYTIM_REGRESSION_DATASET_ID" \
            --dataset-version DRAFT \
            --consent-file "$RUNNER_TEMP/heytim-release-consent.json" \
            --evaluator Builtin.GoalSuccessRate Builtin.ResponseRelevance \
            --name "HeyTimRelease_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            --region "${{ steps.target.outputs.region }}" \
            --kms-key-arn "$HEYTIM_LOGS_KMS_KEY_ARN" > "$result"
          if ! jq -e '
            .status == "COMPLETED"
            and (.agent_invocation_failures | type == "array" and length == 0)
            and (.evaluation_results | type == "object")
            and .evaluation_results.totalNumberOfSessions == 5
            and .evaluation_results.numberOfSessionsCompleted == 5
            and .evaluation_results.numberOfSessionsInProgress == 0
            and .evaluation_results.numberOfSessionsFailed == 0
            and .evaluation_results.numberOfSessionsIgnored == 0
            and (.evaluation_results.evaluatorSummaries | type == "array" and length == 2)
            and ([.evaluation_results.evaluatorSummaries[].evaluatorId] | sort == ["Builtin.GoalSuccessRate", "Builtin.ResponseRelevance"])
            and all(
              .evaluation_results.evaluatorSummaries[];
              .totalEvaluated == 5
              and .totalFailed == 0
              and (.statistics.averageScore | type == "number" and . >= 0.8)
            )
          ' "$result" >/dev/null; then
            echo 'The managed AgentCore regression dataset did not meet the 0.80 release threshold.' >&2
            jq '{status, evaluation_results}' "$result" >&2
            exit 1
          fi

      - name: Remove private synthetic evaluation grant
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/heytim-release-consent.json"

      - name: Preserve AgentCore release evaluation
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: heytim-agentcore-evaluation-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/heytim-release-evaluation

      - name: Run authenticated production workflow
        env:
          HEYTIM_RELEASE_TEST_REFRESH_TOKEN: ${{ secrets.HEYTIM_RELEASE_TEST_REFRESH_TOKEN }}
        run: |
          outputs='services/API/amplify_outputs.json'
          api_url="$(jq -r '.custom.apiUrl // empty' "$outputs")"
          client_id="$(jq -r '.auth.user_pool_client_id // empty' "$outputs")"
          region="$(jq -r '.auth.aws_region // empty' "$outputs")"
          if [[ -z "$api_url" || -z "$client_id" || -z "$region" ]]; then
            echo 'Production client configuration is missing authenticated workflow settings.' >&2
            exit 1
          fi
          auth_parameters="$(jq -nc \
            --arg refreshToken "$HEYTIM_RELEASE_TEST_REFRESH_TOKEN" \
            '{REFRESH_TOKEN:$refreshToken}')"
          id_token="$(aws cognito-idp initiate-auth \
            --region "$region" \
            --auth-flow REFRESH_TOKEN_AUTH \
            --client-id "$client_id" \
            --auth-parameters "$auth_parameters" \
            --query 'AuthenticationResult.IdToken' \
            --output text)"
          if [[ -z "$id_token" || "$id_token" == None ]]; then
            echo 'The release-test refresh token did not produce a Cognito ID token.' >&2
            exit 1
          fi
          echo "::add-mask::$id_token"
          HEYTIM_API_URL="$api_url" HEYTIM_ID_TOKEN="$id_token" \
            npm --prefix services/API run workflow:test

      - name: Stage production client configuration
        run: |
          staging="$RUNNER_TEMP/heytim-production-client-configuration"
          install -d "$staging/services/API" "$staging/apps/iOS/Resources"
          install -m 0600 services/API/amplify_outputs.json "$staging/services/API/amplify_outputs.json"
          install -m 0600 apps/iOS/Resources/amplify_outputs.json \
            "$staging/apps/iOS/Resources/amplify_outputs.json"

      - name: Preserve production client configuration
        uses: actions/upload-artifact@v7
        with:
          name: heytim-production-client-configuration-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/heytim-production-client-configuration

  apple:
    name: Release requested Apple targets
    needs: deploy
    if: ${{ github.event_name == 'release' || inputs.release_scope == 'full' || inputs.release_scope == 'backend-macos' }}
    runs-on: [self-hosted, macOS, ARM64, heytim-apple]
    timeout-minutes: 240
    environment: production
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Add Homebrew build tools to PATH
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"

      - name: Restore production client configuration
        uses: actions/download-artifact@v8
        with:
          name: heytim-production-client-configuration-${{ github.sha }}
          path: .

      - name: Cache native transcription assets
        uses: actions/cache@v6
        with:
          path: packages/heytim-transcription/ios/Generated
          key: heytim-parakeet-tdt-0.6b-v3-apple-v1

      - name: Select Apple build number
        id: apple-build
        env:
          RELEASE_VERSION: ${{ needs.deploy.outputs.release_version }}
        run: |
          version="$RELEASE_VERSION"
          if [[ -z "$version" ]]; then
            version="$(sed -nE "s/.*'MARKETING_VERSION' => '([^']+)'.*/\1/p" \
              apps/iOS/scripts/generate-project.rb | head -1)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Could not resolve an Apple marketing version.' >&2
            exit 1
          fi
          echo "number=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify and release iPhone and Mac builds
        env:
          APPLE_TEAM_ID: ${{ vars.HEYTIM_APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.HEYTIM_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.HEYTIM_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.FROGBOT_APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.FROGBOT_APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.FROGBOT_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.FROGBOT_APPLE_DEVELOPMENT_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.FROGBOT_APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.HEYTIM_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.HEYTIM_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          HEYTIM_MAC_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.HEYTIM_MAC_DEVELOPER_ID_PROFILE_BASE64 }}
          HEYTIM_SPARKLE_PUBLIC_KEY: ${{ vars.HEYTIM_SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.HEYTIM_SPARKLE_PRIVATE_KEY }}
          HEYTIM_BUILD_NUMBER: ${{ steps.apple-build.outputs.number }}
          HEYTIM_MARKETING_VERSION: ${{ steps.apple-build.outputs.version }}
          HEYTIM_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          HEYTIM_RELEASE_SCOPE: ${{ github.event_name == 'release' && 'full' || inputs.release_scope }}
        run: ./apps/iOS/scripts/testflight-ci.sh

      - name: Attach Mac download and Sparkle feed to the GitHub Release
        if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          HEYTIM_BUILD_NUMBER: ${{ steps.apple-build.outputs.number }}
          HEYTIM_MARKETING_VERSION: ${{ steps.apple-build.outputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
              echo 'The Mac release must remain a draft until its artifacts are attached.' >&2
              exit 1
            fi
          fi
          output="apps/iOS/Archives/Direct-macOS-$HEYTIM_BUILD_NUMBER"
          gh release upload "$RELEASE_TAG" \
            "$output/HeyTim-$HEYTIM_MARKETING_VERSION-macOS.dmg" \
            "$output/HeyTim-$HEYTIM_MARKETING_VERSION-macOS.zip" \
            "$output/appcast.xml" \
            --clobber

      - name: Preserve direct Mac release artifacts
        uses: actions/upload-artifact@v7
        with:
