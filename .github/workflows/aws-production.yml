name: Deploy HeyTim production release
run-name: Deploy HeyTim ${{ github.event.release.tag_name || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_scope:
        description: Release both Apple apps in CI or deploy the backend for signed local releases
        required: true
        default: full
        type: choice
        options:
          - full
          - backend-only

concurrency:
  group: heytim-production-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    outputs:
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release source and version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            if [[ "$RELEASE_DRAFT" == true || "$RELEASE_PRERELEASE" == true ]]; then
              echo 'Only published stable releases deploy production.' >&2
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]] \
              || [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo 'Release tags must be vMAJOR.MINOR.PATCH.' >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            if [[ "$(git rev-parse "$GITHUB_REF^{commit}")" != "$GITHUB_SHA" ]] \
              || ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo 'The release tag must point to a commit on main.' >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual production releases must run from main.' >&2
            exit 1
          fi

      - name: Check release branch and production configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN: ${{ vars.HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN }}
          HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN: ${{ vars.HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN }}
          HEYTIM_ALLOW_SHARED_PRODUCTION_ACCOUNT: ${{ vars.HEYTIM_ALLOW_SHARED_PRODUCTION_ACCOUNT }}
          HEYTIM_YOUTUBE_SEARCH_DAILY_LIMIT: ${{ vars.HEYTIM_YOUTUBE_SEARCH_DAILY_LIMIT }}
          HEYTIM_MONTHLY_BUDGET_USD: ${{ vars.HEYTIM_MONTHLY_BUDGET_USD }}
          AGENTCORE_CREDENTIAL_HEYTIM_OPENROUTER: ${{ secrets.AGENTCORE_CREDENTIAL_FROGBOT_OPENROUTER }}
          AGENTCORE_CREDENTIAL_HEYTIMXAPI: ${{ secrets.AGENTCORE_CREDENTIAL_FROGBOTXAPI }}
          AGENTCORE_CREDENTIAL_HEYTIMYOUTUBEAPI: ${{ secrets.AGENTCORE_CREDENTIAL_FROGBOTYOUTUBEAPI }}
          GOOGLE_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_GOOGLE_OAUTH_SECRET_ARN }}
          GITHUB_APP_SECRET_ARN: ${{ secrets.HEYTIM_GITHUB_APP_SECRET_ARN }}
          X_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_X_OAUTH_SECRET_ARN }}
          SLACK_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_SLACK_OAUTH_SECRET_ARN }}
          NOTION_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_NOTION_OAUTH_SECRET_ARN }}
          STRIPE_SECRET_KEY: ${{ secrets.HEYTIM_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.HEYTIM_STRIPE_WEBHOOK_SECRET }}
          STRIPE_PLUS_PRICE_ID: ${{ vars.HEYTIM_STRIPE_PLUS_PRICE_ID }}
          STRIPE_LIVE_MODE: ${{ vars.HEYTIM_STRIPE_LIVE_MODE || 'false' }}
          APNS_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_APPLICATION_ARN }}
          GOOGLE_REVIEW_APPROVED: ${{ vars.HEYTIM_GOOGLE_REVIEW_APPROVED }}
          SLACK_REVIEW_APPROVED: ${{ vars.HEYTIM_SLACK_REVIEW_APPROVED }}
          X_REVIEW_APPROVED: ${{ vars.HEYTIM_X_REVIEW_APPROVED }}
          NOTION_REVIEW_APPROVED: ${{ vars.HEYTIM_NOTION_REVIEW_APPROVED }}
          RELEASE_COMPLIANCE_APPROVED: ${{ vars.HEYTIM_RELEASE_COMPLIANCE_APPROVED }}
          APNS_DEVICE_SMOKE_APPROVED: ${{ vars.HEYTIM_APNS_DEVICE_SMOKE_APPROVED }}
          APPLE_TEAM_ID: ${{ vars.HEYTIM_APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.HEYTIM_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.HEYTIM_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.FROGBOT_APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.FROGBOT_APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.FROGBOT_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.FROGBOT_APPLE_DEVELOPMENT_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.FROGBOT_APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.HEYTIM_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.HEYTIM_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          HEYTIM_SPARKLE_PUBLIC_KEY: ${{ vars.HEYTIM_SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.HEYTIM_SPARKLE_PRIVATE_KEY }}
          RELEASE_SCOPE: ${{ github.event_name == 'release' && 'full' || inputs.release_scope }}
        run: |
          if [[ "$RELEASE_SCOPE" != full && "$RELEASE_SCOPE" != backend-only ]]; then
            echo 'release_scope must be full or backend-only.' >&2
            exit 1
          fi
          required_values=(
            AWS_DEPLOY_ROLE_ARN AMPLIFY_APP_ID
            HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN
            HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN
            HEYTIM_YOUTUBE_SEARCH_DAILY_LIMIT HEYTIM_MONTHLY_BUDGET_USD
            AGENTCORE_CREDENTIAL_HEYTIM_OPENROUTER
            AGENTCORE_CREDENTIAL_HEYTIMXAPI AGENTCORE_CREDENTIAL_HEYTIMYOUTUBEAPI
            GOOGLE_OAUTH_SECRET_ARN GITHUB_APP_SECRET_ARN X_OAUTH_SECRET_ARN
            SLACK_OAUTH_SECRET_ARN NOTION_OAUTH_SECRET_ARN APNS_APPLICATION_ARN
          )
          if [[ "$RELEASE_SCOPE" == full ]]; then
            required_values+=(
              APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID
              APP_STORE_CONNECT_PRIVATE_KEY APPLE_DISTRIBUTION_CERTIFICATE_BASE64
              APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
              APPLE_DEVELOPMENT_CERTIFICATE_BASE64 APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD
              DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64
              DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD
              HEYTIM_SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY
            )
          fi
          missing=()
          for name in "${required_values[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "$RELEASE_SCOPE" == full ]]; then
            if ! sparkle_public_key_size="$(printf '%s' "$HEYTIM_SPARKLE_PUBLIC_KEY" \
              | base64 --decode 2>/dev/null | wc -c | tr -d ' ')" \
              || [[ "$sparkle_public_key_size" != 32 ]]; then
              echo 'HEYTIM_SPARKLE_PUBLIC_KEY must be a base64-encoded 32-byte Ed25519 public key.' >&2
              exit 1
            fi
          fi
          stripe_values=(STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PLUS_PRICE_ID)
          stripe_value_count=0
          for name in "${stripe_values[@]}"; do
            [[ -n "${!name}" ]] && ((stripe_value_count += 1))
          done
          if (( stripe_value_count != 0 && stripe_value_count != ${#stripe_values[@]} )); then
            echo 'Stripe API key, webhook secret, and Plus Price ID must be configured together.' >&2
            exit 1
          fi
          if (( stripe_value_count == ${#stripe_values[@]} )); then
            stripe_mode='test'
            [[ "$STRIPE_LIVE_MODE" == true ]] && stripe_mode='live'
            if [[ "$STRIPE_SECRET_KEY" != sk_${stripe_mode}_* \
              && "$STRIPE_SECRET_KEY" != rk_${stripe_mode}_* ]]; then
              echo "Stripe API key is not a valid $stripe_mode key." >&2
              exit 1
            fi
            if [[ "$STRIPE_WEBHOOK_SECRET" != whsec_* ]]; then
              echo 'Stripe webhook signing secret is invalid.' >&2
              exit 1
            fi
            if [[ "$STRIPE_PLUS_PRICE_ID" != price_* ]]; then
              echo 'Stripe Plus Price ID is invalid.' >&2
              exit 1
            fi
          fi
          attestations=(
            GOOGLE_REVIEW_APPROVED SLACK_REVIEW_APPROVED X_REVIEW_APPROVED
            NOTION_REVIEW_APPROVED RELEASE_COMPLIANCE_APPROVED APNS_DEVICE_SMOKE_APPROVED
          )
          for name in "${attestations[@]}"; do
            if [[ "${!name}" != true ]]; then
              echo "$name must be set to true after its release checklist item is complete." >&2
              exit 1
            fi
          done
          if [[ "$RELEASE_SCOPE" == full ]]; then
            if ! printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" \
              | openssl pkey -check -noout >/dev/null 2>&1; then
              echo 'HEYTIM_APP_STORE_CONNECT_PRIVATE_KEY is not a valid private key.' >&2
              exit 1
            fi
            certificate_bundle="$RUNNER_TEMP/heytim-distribution.p12"
            development_bundle="$RUNNER_TEMP/heytim-development.p12"
            trap 'find "$certificate_bundle" "$development_bundle" -delete 2>/dev/null || true' EXIT
            if ! printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" \
              | base64 --decode > "$certificate_bundle"; then
              echo 'HEYTIM_APPLE_DISTRIBUTION_CERTIFICATE_BASE64 is not valid base64.' >&2
              exit 1
            fi
            if ! openssl pkcs12 -in "$certificate_bundle" \
              -passin env:APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD -clcerts -nokeys 2>/dev/null \
              | openssl x509 -checkend 86400 -noout >/dev/null 2>&1; then
              echo 'The Apple Distribution certificate is invalid, expired, or expires within 24 hours.' >&2
              exit 1
            fi
            if ! openssl pkcs12 -in "$certificate_bundle" \
              -passin env:APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD -nocerts -nodes 2>/dev/null \
              | openssl pkey -check -noout >/dev/null 2>&1; then
              echo 'The Apple Distribution certificate bundle does not contain its private key.' >&2
              exit 1
            fi
            if ! openssl pkcs12 -in "$certificate_bundle" \
              -passin env:APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD -clcerts -nokeys 2>/dev/null \
              | openssl x509 -subject -noout 2>/dev/null | grep -q 'Apple Distribution'; then
              echo 'The supplied certificate is not an Apple Distribution certificate.' >&2
              exit 1
            fi
            if ! printf '%s' "$APPLE_DEVELOPMENT_CERTIFICATE_BASE64" \
              | base64 --decode > "$development_bundle"; then
              echo 'HEYTIM_APPLE_DEVELOPMENT_CERTIFICATE_BASE64 is not valid base64.' >&2
              exit 1
            fi
            if ! openssl pkcs12 -in "$development_bundle" \
              -passin env:APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD -clcerts -nokeys 2>/dev/null \
              | openssl x509 -checkend 86400 -noout >/dev/null 2>&1; then
              echo 'The Apple Development certificate is invalid or expires within 24 hours.' >&2
              exit 1
            fi
            if ! openssl pkcs12 -in "$development_bundle" \
              -passin env:APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD -nocerts -nodes 2>/dev/null \
              | openssl pkey -check -noout >/dev/null 2>&1; then
              echo 'The Apple Development certificate bundle does not contain its private key.' >&2
              exit 1
            fi
            if ! openssl pkcs12 -in "$development_bundle" \
              -passin env:APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD -clcerts -nokeys 2>/dev/null \
              | openssl x509 -subject -noout 2>/dev/null | grep -q 'Apple Development'; then
              echo 'The supplied certificate is not an Apple Development certificate.' >&2
              exit 1
            fi
            find "$certificate_bundle" "$development_bundle" -delete
            trap - EXIT
          fi
          node scripts/check-production-config.mjs

      - name: Resolve production AWS target
        id: target
        run: |
          echo "account=$(jq -r '.[] | select(.name == "production") | .account' agentcore/aws-targets.json)" >> "$GITHUB_OUTPUT"
          echo "region=$(jq -r '.[] | select(.name == "production") | .region' agentcore/aws-targets.json)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.target.outputs.region }}

      - name: Verify immutable non-root release source and account
        run: |
          ./scripts/assert-release-ready.sh --aws
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$actual_account" != "${{ steps.target.outputs.account }}" ]]; then
            echo "Deployment role resolved to AWS account $actual_account instead of the configured production account." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            services/API/package-lock.json
            agentcore/cdk/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: services/runtime/uv.lock

      - name: Install production dependencies
        run: |
          npm ci --prefix services/API
          npm ci --prefix agentcore/cdk
          npm install --global @aws/agentcore@0.29.0

      - name: Verify production services
        run: ./scripts/verify.sh server

      - name: Audit production dependencies
        run: ./scripts/audit-dependencies.sh

      - name: Use repository-managed AgentCore CDK dependencies
        run: agentcore config disableDependencyManagement true

      - name: Deploy AgentCore production target
        env:
          HEYTIM_ENVIRONMENT: production
          HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN: ${{ vars.HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN }}
          HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN: ${{ vars.HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN }}
          HEYTIM_ALLOW_SHARED_PRODUCTION_ACCOUNT: ${{ vars.HEYTIM_ALLOW_SHARED_PRODUCTION_ACCOUNT }}
          AGENTCORE_CREDENTIAL_HEYTIM_OPENROUTER: ${{ secrets.AGENTCORE_CREDENTIAL_FROGBOT_OPENROUTER }}
          AGENTCORE_CREDENTIAL_HEYTIMXAPI: ${{ secrets.AGENTCORE_CREDENTIAL_FROGBOTXAPI }}
          AGENTCORE_CREDENTIAL_HEYTIMYOUTUBEAPI: ${{ secrets.AGENTCORE_CREDENTIAL_FROGBOTYOUTUBEAPI }}
        run: |
          umask 077
          {
            printf 'AGENTCORE_CREDENTIAL_HEYTIM_OPENROUTER=%s\n' "$AGENTCORE_CREDENTIAL_HEYTIM_OPENROUTER"
            printf 'AGENTCORE_CREDENTIAL_HEYTIMXAPI=%s\n' "$AGENTCORE_CREDENTIAL_HEYTIMXAPI"
            printf 'AGENTCORE_CREDENTIAL_HEYTIMYOUTUBEAPI=%s\n' "$AGENTCORE_CREDENTIAL_HEYTIMYOUTUBEAPI"
          } > agentcore/.env.local
          trap 'rm -f agentcore/.env.local' EXIT
          agentcore deploy --target production --yes

      - name: Resolve deployed AgentCore resources
        run: |
          agentcore status --target production --json > /tmp/heytim-production-status.json
          target='.deployedState.targets.production.resources'
          runtime_arn="$(jq -r "$target.runtimes.HeyTim.runtimeArn // empty" /tmp/heytim-production-status.json)"
          memory_arn="$(jq -r "$target.memories.HeyTimMemory.memoryArn // empty" /tmp/heytim-production-status.json)"
          gateway_arn="$(jq -r "$target.mcp.gateways.HeyTimTools.gatewayArn // empty" /tmp/heytim-production-status.json)"
          gateway_id="$(jq -r "$target.mcp.gateways.HeyTimTools.gatewayId // empty" /tmp/heytim-production-status.json)"
          gateway_url="$(jq -r "$target.mcp.gateways.HeyTimTools.gatewayUrl // empty" /tmp/heytim-production-status.json)"
          if [[ "$runtime_arn" != arn:aws:bedrock-agentcore:* ]] \
            || [[ "$memory_arn" != arn:aws:bedrock-agentcore:* ]] \
            || [[ "$gateway_arn" != arn:aws:bedrock-agentcore:* ]] \
            || [[ -z "$gateway_id" ]] \
            || [[ "$gateway_url" != https://*.gateway.bedrock-agentcore.*.amazonaws.com/mcp ]]; then
            echo 'AgentCore production resources are not ready.' >&2
            exit 1
          fi
          echo "HEYTIM_AGENT_RUNTIME_ARN=$runtime_arn" >> "$GITHUB_ENV"
          echo "HEYTIM_MEMORY_ID=${memory_arn##*/}" >> "$GITHUB_ENV"
          echo "HEYTIM_AGENT_GATEWAY_ARN=$gateway_arn" >> "$GITHUB_ENV"
          echo "HEYTIM_AGENT_GATEWAY_ID=$gateway_id" >> "$GITHUB_ENV"
          echo "HEYTIM_AGENT_GATEWAY_URL=$gateway_url" >> "$GITHUB_ENV"

      - name: Deploy Amplify production backend
        working-directory: services/API
        env:
          HEYTIM_ENVIRONMENT: production
          HEYTIM_BOT_EMAIL_STAGE: receive
          HEYTIM_SES_RULE_SET_NAME: inboxai-inboxai-cc
          HEYTIM_BOT_EMAIL_AVAILABLE: 'true'
          HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN: ${{ vars.HEYTIM_AGENTCORE_MEMORY_KMS_KEY_ARN }}
          HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN: ${{ vars.HEYTIM_LEGACY_TOKEN_VAULT_KMS_KEY_ARN }}
          HEYTIM_GOOGLE_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_GOOGLE_OAUTH_SECRET_ARN }}
          HEYTIM_GITHUB_APP_SECRET_ARN: ${{ secrets.HEYTIM_GITHUB_APP_SECRET_ARN }}
          HEYTIM_X_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_X_OAUTH_SECRET_ARN }}
          HEYTIM_SLACK_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_SLACK_OAUTH_SECRET_ARN }}
          HEYTIM_NOTION_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_NOTION_OAUTH_SECRET_ARN }}
          HEYTIM_MICROSOFT_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_MICROSOFT_OAUTH_SECRET_ARN }}
          HEYTIM_HUBSPOT_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_HUBSPOT_OAUTH_SECRET_ARN }}
          HEYTIM_JIRA_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_JIRA_OAUTH_SECRET_ARN }}
          HEYTIM_ZOOM_OAUTH_SECRET_ARN: ${{ secrets.HEYTIM_ZOOM_OAUTH_SECRET_ARN }}
          HEYTIM_STRIPE_SECRET_ID: ${{ vars.HEYTIM_STRIPE_PLUS_PRICE_ID != '' && 'heytim/stripe/production' || '' }}
          HEYTIM_STRIPE_PLUS_PRICE_ID: ${{ vars.HEYTIM_STRIPE_PLUS_PRICE_ID }}
          HEYTIM_STRIPE_LIVE_MODE: ${{ vars.HEYTIM_STRIPE_LIVE_MODE || 'false' }}
          HEYTIM_STRIPE_AUTOMATIC_TAX: ${{ vars.HEYTIM_STRIPE_AUTOMATIC_TAX || 'false' }}
          HEYTIM_FREE_MONTHLY_CREDITS: ${{ vars.HEYTIM_FREE_MONTHLY_CREDITS || '30' }}
          HEYTIM_PLUS_MONTHLY_CREDITS: ${{ vars.HEYTIM_PLUS_MONTHLY_CREDITS || '300' }}
          HEYTIM_PLUS_PRICE_CENTS: ${{ vars.HEYTIM_PLUS_PRICE_CENTS || '2000' }}
          HEYTIM_YOUTUBE_SEARCH_DAILY_LIMIT: ${{ vars.HEYTIM_YOUTUBE_SEARCH_DAILY_LIMIT }}
          HEYTIM_MONTHLY_BUDGET_USD: ${{ vars.HEYTIM_MONTHLY_BUDGET_USD }}
          HEYTIM_APNS_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_APPLICATION_ARN }}
          HEYTIM_APNS_SANDBOX_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_SANDBOX_APPLICATION_ARN }}
        run: npx ampx pipeline-deploy --branch main --app-id "${{ vars.AMPLIFY_APP_ID }}" --outputs-out-dir .

      - name: Provision Stripe billing secret
        env:
          STRIPE_SECRET_KEY: ${{ secrets.HEYTIM_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.HEYTIM_STRIPE_WEBHOOK_SECRET }}
          STRIPE_PLUS_PRICE_ID: ${{ vars.HEYTIM_STRIPE_PLUS_PRICE_ID }}
        run: |
          if [[ -z "$STRIPE_SECRET_KEY" && -z "$STRIPE_WEBHOOK_SECRET" && -z "$STRIPE_PLUS_PRICE_ID" ]]; then
            exit 0
          fi
          secret_name='heytim/stripe/production'
          secret_value="$(jq -nc \
            --arg secretKey "$STRIPE_SECRET_KEY" \
            --arg webhookSecret "$STRIPE_WEBHOOK_SECRET" \
            '{secretKey:$secretKey,webhookSecret:$webhookSecret}')"
          for attempt in {1..6}; do
            if secret_arn="$(aws secretsmanager describe-secret \
              --secret-id "$secret_name" --query ARN --output text 2>/dev/null)"; then
              aws secretsmanager put-secret-value \
                --secret-id "$secret_arn" --secret-string "$secret_value" >/dev/null && exit 0
            elif aws secretsmanager create-secret \
              --name "$secret_name" \
              --description 'Stripe server and webhook credentials for HeyTim billing.' \
              --secret-string "$secret_value" >/dev/null 2>&1; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo 'Could not provision the Stripe billing secret after the deployment role update.' >&2
          exit 1

      - name: Deploy external research gateway targets
        run: ./scripts/deploy-external-gateway-targets.sh

      - name: Smoke test X and YouTube research
        working-directory: services/runtime
        run: uv run --frozen python scripts/smoke_external_gateway.py

      - name: Generate release client configuration
        working-directory: services/API
        run: npm run outputs:apple

      - name: Ensure production meme template catalog
        working-directory: services/runtime
        run: |
          outputs='../API/amplify_outputs.json'
          config='../../agentcore/agentcore.json'
          bucket="$(jq -r '.custom.filesBucketName // empty' "$outputs")"
          prefix="$(jq -r '.runtimes[] | select(.name == "HeyTim") | .envVars[] | select(.name == "HEYTIM_MEME_TEMPLATE_PREFIX") | .value' "$config")"
          if [[ -z "$bucket" || -z "$prefix" ]]; then
            echo 'Production meme-template storage configuration is missing.' >&2
            exit 1
          fi
          catalog_key="${prefix%/}/catalog.json"
          if aws s3api head-object --bucket "$bucket" --key "$catalog_key" >/dev/null 2>&1; then
            echo "Meme template catalog already exists at s3://$bucket/$catalog_key."
          else
            uv run --frozen python scripts/sync_meme_templates.py \
              --bucket "$bucket" \
              --prefix "$prefix"
          fi

      - name: Resolve production observability outputs
        run: |
          output() { jq -r ".custom.$1 // empty" services/API/amplify_outputs.json; }
          logs_key_arn="$(output logsKeyArn)"
          alarm_topic_arn="$(output alarmTopicArn)"
          feedback_role_arn="$(output nativePushFeedbackRoleArn)"
          if [[ "$logs_key_arn" != arn:aws:kms:* ]] \
            || [[ "$alarm_topic_arn" != arn:aws:sns:* ]] \
            || [[ "$feedback_role_arn" != arn:aws:iam::* ]]; then
            echo 'One or more production observability outputs are missing.' >&2
            exit 1
          fi
          echo "HEYTIM_LOGS_KMS_KEY_ARN=$logs_key_arn" >> "$GITHUB_ENV"
          echo "HEYTIM_ALARM_TOPIC_ARN=$alarm_topic_arn" >> "$GITHUB_ENV"
          echo "HEYTIM_NATIVE_PUSH_FEEDBACK_ROLE_ARN=$feedback_role_arn" >> "$GITHUB_ENV"

      - name: Configure runtime logs, alarms, and push feedback
        env:
          HEYTIM_APNS_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_APPLICATION_ARN }}
          HEYTIM_APNS_SANDBOX_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_SANDBOX_APPLICATION_ARN }}
        run: |
          ./scripts/harden-agentcore-logs.sh
          ./scripts/configure-agentcore-observability.sh
          ./scripts/configure-native-push-feedback.sh

      - name: Verify deployed production resources
        env:
          HEYTIM_APNS_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_APPLICATION_ARN }}
          HEYTIM_APNS_SANDBOX_APPLICATION_ARN: ${{ vars.HEYTIM_APNS_SANDBOX_APPLICATION_ARN }}
        run: ./scripts/verify-production-deployment.sh

      - name: Stage production client configuration
        run: |
          staging="$RUNNER_TEMP/heytim-production-client-configuration"
          install -d "$staging/services/API" "$staging/apps/iOS/Resources"
          install -m 0600 services/API/amplify_outputs.json "$staging/services/API/amplify_outputs.json"
          install -m 0600 apps/iOS/Resources/amplify_outputs.json \
            "$staging/apps/iOS/Resources/amplify_outputs.json"

      - name: Preserve production client configuration
        uses: actions/upload-artifact@v7
        with:
          name: heytim-production-client-configuration-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/heytim-production-client-configuration

  apple:
    name: Release iPhone to TestFlight and Mac directly
    needs: deploy
    if: ${{ github.event_name == 'release' || inputs.release_scope == 'full' }}
    runs-on: [self-hosted, macOS, ARM64, heytim-apple]
    timeout-minutes: 120
    environment: production
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Add Homebrew build tools to PATH
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"

      - name: Restore production client configuration
        uses: actions/download-artifact@v8
        with:
          name: heytim-production-client-configuration-${{ github.sha }}
          path: .

      - name: Cache native transcription assets
        uses: actions/cache@v6
        with:
          path: packages/heytim-transcription/ios/Generated
          key: heytim-nemotron-apple-v3

      - name: Select Apple build number
        id: apple-build
        env:
          RELEASE_VERSION: ${{ needs.deploy.outputs.release_version }}
        run: |
          version="$RELEASE_VERSION"
          if [[ -z "$version" ]]; then
            version="$(sed -nE "s/.*'MARKETING_VERSION' => '([^']+)'.*/\1/p" \
              apps/iOS/scripts/generate-project.rb | head -1)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Could not resolve an Apple marketing version.' >&2
            exit 1
          fi
          echo "number=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify and release iPhone and Mac builds
        env:
          APPLE_TEAM_ID: ${{ vars.HEYTIM_APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.HEYTIM_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.HEYTIM_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.FROGBOT_APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.FROGBOT_APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.FROGBOT_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.FROGBOT_APPLE_DEVELOPMENT_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.FROGBOT_APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.HEYTIM_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.HEYTIM_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          HEYTIM_SPARKLE_PUBLIC_KEY: ${{ vars.HEYTIM_SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.HEYTIM_SPARKLE_PRIVATE_KEY }}
          HEYTIM_BUILD_NUMBER: ${{ steps.apple-build.outputs.number }}
          HEYTIM_MARKETING_VERSION: ${{ steps.apple-build.outputs.version }}
          HEYTIM_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./apps/iOS/scripts/testflight-ci.sh

      - name: Attach Mac download and Sparkle feed to the GitHub Release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          HEYTIM_BUILD_NUMBER: ${{ steps.apple-build.outputs.number }}
          HEYTIM_MARKETING_VERSION: ${{ steps.apple-build.outputs.version }}
        run: |
          output="apps/iOS/Archives/Direct-macOS-$HEYTIM_BUILD_NUMBER"
          gh release upload "$RELEASE_TAG" \
            "$output/HeyTim-$HEYTIM_MARKETING_VERSION-macOS.dmg" \
            "$output/HeyTim-$HEYTIM_MARKETING_VERSION-macOS.zip" \
            "$output/appcast.xml" \
            --clobber

      - name: Preserve direct Mac release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: heytim-macos-${{ steps.apple-build.outputs.number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/iOS/Archives/Direct-macOS-${{ steps.apple-build.outputs.number }}/HeyTim-*-macOS.zip
            apps/iOS/Archives/Direct-macOS-${{ steps.apple-build.outputs.number }}/HeyTim-*-macOS.dmg
            apps/iOS/Archives/Direct-macOS-${{ steps.apple-build.outputs.number }}/appcast.xml
