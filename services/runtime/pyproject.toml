[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "HeyTim"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # CodeZip resolves dependencies independently of uv.lock.
    "aws-opentelemetry-distro == 0.19.0",
    "bedrock-agentcore >= 1.22.0",
    # AgentCore CodeZip resolves from this file instead of uv.lock. AWS SDK
    # patch releases are frequent, so pin both halves to keep deployed bundles
    # identical to the version verified in uv.lock.
    "boto3 == 1.43.90",
    "botocore==1.43.92",
    # AgentCore CodeZip resolves async file I/O transitives afresh. Pin caio to
    # the version exercised by the lockfile instead of accepting same-day PyPI drift.
    "caio == 0.12.5",
    # Direct dependency: GitHub App JWTs use audited PEM parsing and RSA signing.
    "cryptography == 50.0.1",
    "cyclopts == 4.25.2",
    # The toolkit resolves its first supported AgentCore target as manylinux2014.
    # Pin compiled transitive packages to versions that publish that ARM64 wheel.
    "greenlet==3.5.5",
    # CodeZip resolves OpenTelemetry/Google API transitives afresh; keep the
    # packaged protobuf definitions identical to the tested lockfile.
    "googleapis-common-protos == 1.75.3",
    # Direct dependency: hardened remote MCP transports use HTTPX directly.
    "httpx == 0.28.1",
    # CodeZip resolves HTTPX transitives afresh; keep the packaged version
    # identical to the runtime lockfile and its integration test.
    "idna == 3.19",
    # CodeZip resolves transitive packages afresh. Keep the compiled gRPC wheel
    # identical to the version exercised by the locked runtime environment.
    "grpcio == 1.83.1",
    # CodeZip resolves OpenAI transitives afresh; keep the packaged parser on
    # the exact version exercised by the locked runtime environment.
    "jiter == 0.16.0",
    # Direct dependency: the hardened remote transport uses MCP's streamable HTTP API.
    "mcp >= 1.29.1, < 2.0.0",
    "mcp-proxy-for-aws >= 1.6.0, < 2.0.0",
    # AgentCore CodeZip installs from pyproject, not uv.lock. Keep fresh package
    # resolution on the tested version; 6.8.0 otherwise drifts from the lock.
    "multidict==6.8.0",
    # AgentCore CodeZip resolves instrumentation transitives afresh. Keep the
    # packaged GenAI helpers identical to the version verified in uv.lock.
    "opentelemetry-util-genai == 1.1b0",
    "openpyxl >= 3.1.5, < 4.0.0",
    "pillow == 12.3.0",
    # CodeZip resolves this browser dependency afresh instead of using uv.lock.
    # Keep the deployed driver identical to the version exercised by tests.
    "playwright == 1.62.0",
    # AgentCore CodeZip resolves transitives afresh; keep the packaged version
    # aligned with the runtime lockfile and its integration test.
    "platformdirs == 4.11.8",
    # CodeZip resolves FastMCP transitives afresh; keep this on the locked version.
    "py-key-value-aio == 0.4.5",
    # AgentCore CodeZip resolves transitives afresh; retain the tested JWT version.
    "pyjwt == 2.14.0",
    # Keep fresh CodeZip resolution on the already-tested lockfile versions.
    "propcache == 0.5.2",
    "python-docx >= 1.2.0, < 2.0.0",
    "python-pptx >= 1.0.2, < 2.0.0",
    "reportlab>=4.4.4,<6.0.0",
    # CodeZip resolves Beautiful Soup transitives afresh; keep its selector
    # parser aligned with the version exercised by the locked runtime.
    "soupsieve == 2.9.2",
    # CodeZip resolves transitives independently; keep it on the tested lock.
    "starlette == 1.6.0",
    # CodeZip resolves afresh; deploy the live harness and SDK versions exercised
    # by our runtime tests. Dependabot advances these public PyPI releases weekly.
    "strands-agents[openai] == 1.56.0",
    "strands-agents-tools[agent_core_browser,agent_core_code_interpreter] == 0.8.8",
    "strands-harness == 0.1.1",
    # AgentCore's package builder otherwise takes the newest Uvicorn release,
    # which can drift from the dependency-complete archive verified in uv.lock.
    "uvicorn == 0.52.4",
    "urllib3 == 2.7.0",
    # CodeZip resolves Uvicorn's optional file watcher afresh. Keep it aligned
    # with the version exercised by the locked runtime environment.
    "watchfiles == 1.2.0",
    "wcwidth == 0.8.3",
    "yarl == 1.24.5",
    # CodeZip resolves transitive instrumentation dependencies afresh. Keep its
    # ARM64 wheel identical to the version recorded in uv.lock.
    "wrapt==2.4.1",
]

[dependency-groups]
dev = [
    "jsonschema >= 4.26.0, < 5.0.0",
    "pytest>=8.4.0,<10.0.0",
    "ruff >= 0.14.0, < 1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["runtime/heytim_runtime", "runtime/model"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff.lint.isort]
known-first-party = ["heytim_runtime", "group_context", "model"]
