[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "FrogBot"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "mcp >= 1.29.1, < 2.0.0",
    "mcp-proxy-for-aws >= 1.6.0, < 2.0.0",
    "openpyxl >= 3.1.5, < 4.0.0",
    "python-docx >= 1.2.0, < 2.0.0",
    "python-pptx >= 1.0.2, < 2.0.0",
    "reportlab >= 4.4.4, < 5.0.0",
    "strands-agents >= 1.54.0, < 2.0.0",
    "strands-agents-tools[agent_core_browser,agent_core_code_interpreter] >= 0.2.0, < 1.0.0",
    "strands-agents-stan",
]

[dependency-groups]
dev = [
    "pytest >= 8.4.0, < 9.0.0",
    "ruff >= 0.14.0, < 1.0.0",
]

[tool.uv.sources]
strands-agents-stan = { path = "vendor/strands_agents_stan-0.0.1.dev48+g6ba1843a4-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff.lint.isort]
known-first-party = ["frogbot_runtime", "model"]
