[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "FrogBot"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "mcp-proxy-for-aws >= 1.6.0, < 2.0.0",
    "strands-agents >= 1.54.0, < 2.0.0",
    "strands-agents-tools[agent_core_browser,agent_core_code_interpreter] >= 0.2.0, < 1.0.0",
    "strands-agents-stan",
]

[tool.uv.sources]
strands-agents-stan = { path = "vendor/strands_agents_stan-0.0.1.dev48+g6ba1843a4-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
